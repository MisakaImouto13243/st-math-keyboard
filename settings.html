<div class="stmk-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>数学公式键盘</b>
            <div class="fa-solid fa-circle-chevron-down inline-drawer-icon down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="stmk_orb_visible">
                <input id="stmk_orb_visible" type="checkbox">
                <span>显示悬浮球</span>
            </label>
            <label class="checkbox_label" for="stmk_clear_after_insert">
                <input id="stmk_clear_after_insert" type="checkbox">
                <span>插入聊天框后清空草稿</span>
            </label>
            <div class="flex-container">
                <input id="stmk_reset_orb" class="menu_button" type="button" value="重置悬浮球位置">
            </div>
            <small>公式会以 <code>latex</code> 代码块插入聊天输入框，聊天里的显示由官方 LaTeX 扩展负责。</small>
        </div>
    </div>
</div>
